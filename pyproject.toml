[project]
# Name and version of the library.
name = "pytorch_template"
version = "0.1.0"

# Short description of the project.
description = "A PyTorch project template with automated development workflows."

# Author information.
authors = [{ name = "Tristan Tibbs", email = "tristantibbs@gmail.com" }]

# License under which the project is distributed.
license = { text = "MIT" }

# Path to the README file for project documentation.
readme = "README.md"

# Required Python version.
requires-python = ">=3.11"

# Production dependencies (none in this example, add here if needed).
dependencies = []

# Development dependencies, not required in production.
[dependency-groups]
dev = [
  "ruff>=0.12.11",    # Ruff: A linter and code formatter.
  "pytest>=8.4.1"     # Pytest: A testing framework for running unit tests.
]

[build-system]
# Build system using hatchling - modern, fast Python packaging tool
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Specify where the package is located in the repository
packages = ["src/pytorch_template"]

[tool.ruff]
line-length = 88    # Set the maximum line length (88 chars for better readability)
indent-width = 4    # Number of spaces for indentation (default is 4 spaces)
target-version = "py311"    # Target Python version for modern syntax

[tool.ruff.lint]
select = [
    "E",    # PEP 8 errors (syntax or structural errors in the code)
    "F",    # Pyflakes rules for catching unused imports and variables
    "W",    # General warnings for non-standard Python usage
    "I",    # Import sorting and organization
    "N",    # Naming convention rules for variables, functions, and classes
    "D",    # pydocstyle - docstring conventions
    "BLE",  # Better list expressions and prevents suboptimal code patterns
    "B",    # Bug risk and best practice rules
    "A",    # Anti-pattern detection and prevents commonly misused idioms
    "ICN",  # Improved code readability and naming conventions
    "Q",    # Consistent usage of single or double quotes
    "PD",   # Pandas-specific best practices and catches common issues
    "ANN",  # Checks for type/return annotations
    "UP",   # Upgrade syntax for newer Python versions
    "C4",   # Code complexity and comprehensions
    "SIM",  # Code simplification suggestions
    "PT",   # pytest-style checks
    "PTH",  # Use pathlib instead of os.path
    "PIE",  # Miscellaneous linting rules
    "ISC",  # Implicit string concatenation
    "TID",  # Tidy imports
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "D203",  # One blank line before class (conflicts with D211)
    "D213",  # Multi-line summary second line (conflicts with D212)
]
unfixable = [
    "F401",  # Prevent auto-removal of unused imports while editing
]

# Google-style docstring configuration
[tool.ruff.lint.pydocstyle]
convention = "google"

# Import sorting configuration
[tool.ruff.lint.isort]
force-sort-within-sections = true

# Tidy imports configuration
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Code formatting configuration
[tool.ruff.format]
quote-style = "double"    # Use double quotes for strings
indent-style = "space"    # Use spaces for indentation
